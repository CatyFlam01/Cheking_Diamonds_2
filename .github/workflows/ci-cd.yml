name: Diamonds Project CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Check code coverage
        run: |
          coverage report --fail-under=70

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t diamonds-app:${{ github.sha }} -f docker/Dockerfile .

      - name: Test Docker image
        run: |
          docker run --rm diamonds-app:${{ github.sha }} python --version

      - name: Save Docker image
        run: |
          docker save diamonds-app:${{ github.sha }} > diamonds-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: diamonds-app.tar

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install linters
        run: |
          pip install flake8 black mypy

      - name: Run flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Run black check
        run: |
          black --check src/ tests/

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server simulation
        run: |
          echo "Deploying to production server..."
          echo "Deployment complete"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            requirements.txt
            README.md

  notify:
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify success
        if: needs.test.result == 'success' && needs.build.result == 'success'
        run: |
          echo "All jobs completed successfully!"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Some jobs failed!"
          echo "Please check the logs"
